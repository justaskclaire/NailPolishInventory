<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="icon" type="image/svg+xml" href="https://justaskclaire.github.io/NailPolishInventory/public/favicon.svg" />

  <style>
    :root {
      --color-gray-50: #fafafa;
      --color-gray-600: #525252;
      --color-gray-900: #171717;
      --color-primary-600: #e11d48;
      --color-primary-700: #be123c;
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      --font-family-display: 'Playfair Display', Georgia, 'Times New Roman', serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-family);
      background: var(--color-gray-50);
      color: var(--color-gray-900);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      max-width: 30rem;
    }

    h1 {
      font-family: var(--font-family-display);
      font-weight: 800;
      font-size: 1.5rem;
      margin-bottom: 0.75rem;
    }

    .code {
      font-family: var(--font-family-display);
      font-weight: 800;
      font-size: 4rem;
      line-height: 1;
      color: var(--color-primary-600);
      margin-bottom: 0.5rem;
    }

    p {
      color: var(--color-gray-600);
      font-size: 1rem;
      margin-bottom: 2rem;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
    }

    .links a {
      display: inline-block;
      padding: 0.6rem 1.25rem;
      border-radius: 0.875rem;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      transition: background 150ms ease;
    }

    .links a.primary {
      background: var(--color-primary-600);
      color: #ffffff;
    }

    .links a.primary:hover {
      background: var(--color-primary-700);
    }

    .links a.secondary {
      background: #f5f5f5;
      color: var(--color-gray-900);
    }

    .links a.secondary:hover {
      background: #e5e5e5;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>This page wandered off</h1>

    <div class="links">
      <a class="primary" href="https://justaskclaire.github.io/NailPolishInventory/">Polishes</a>
      <a class="secondary" href="https://justaskclaire.github.io/NailPolishInventory/inspo/">Inspo</a>

    </div>
  </div>
</body>
</html>
